[package]
name = "fuju-trace-db-node"
version = "0.1.9"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.10.0", default-features = false, features = ["napi4"] }
napi-derive = "3.5.8"
fuju-trace-engine = { path = "../fuju-trace-engine/crates/fuju-trace-engine" }

[build-dependencies]
napi-build = "2.3.2"
