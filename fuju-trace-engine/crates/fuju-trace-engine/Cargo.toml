[package]
name = "fuju-trace-engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
fuju-trace-core = { path = "../fuju-trace-core" }
fuju-trace-manifest = { path = "../fuju-trace-manifest" }
fuju-trace-wal = { path = "../fuju-trace-wal" }
fuju-trace-memtable = { path = "../fuju-trace-memtable" }
# 可选：gzip 请求体解压。默认关 → 离线 std-only 构建不受影响；开 `--features gzip` 才拉 flate2。
flate2 = { version = "1", optional = true }

[features]
gzip = ["dep:flate2"]
test-failpoints = []
