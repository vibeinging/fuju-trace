[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuju-trace"
version = "0.1.9"
description = "Fuju Trace instrumentation SDK — emit trace events with deterministic, engine-matching event_id"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Fuju Trace" }]
keywords = ["observability", "llm", "agent", "tracing", "trace", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = []  # 纯标准库，零运行时依赖

[project.optional-dependencies]
vexdb = ["fuju-trace-vexdb[driver]==0.1.9"]

[project.scripts]
fuju-trace = "fuju_trace.cli:main"

[project.urls]
Homepage = "https://github.com/vibeinging/fuju-trace"
Repository = "https://github.com/vibeinging/fuju-trace"
Issues = "https://github.com/vibeinging/fuju-trace/issues"

[tool.hatch.build.targets.wheel]
packages = ["fuju_trace"]
