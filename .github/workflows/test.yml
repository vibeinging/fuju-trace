name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip build pytest "maturin>=1.8,<2.0"
          python -m pip install -e "./fuju-trace-db-python"
      - name: Install JavaScript test dependencies
        run: |
          npm ci --prefix fuju-trace-sdk/typescript
          npm ci --prefix fuju-trace-node --omit=optional
      - name: Test Rust engine
        run: cargo test --offline --manifest-path fuju-trace-engine/Cargo.toml
      - name: Test SDK packages
        run: ./scripts/package_mode_eval.sh --skip-node --skip-python-db --skip-rust-db
      - name: Test Python embedded DB
        run: ./scripts/package_mode_eval.sh --skip-node --skip-rust-db --skip-sdk
      - name: Test Rust embedded DB
        run: ./scripts/package_mode_eval.sh --skip-node --skip-python-db --skip-sdk
      - name: Test Node embedded DB
        run: ./scripts/package_mode_eval.sh --skip-python-db --skip-rust-db --skip-sdk
      - name: Test crash recovery
        run: |
          cargo build -p fuju-trace-engine --example crash_worker --release --manifest-path fuju-trace-engine/Cargo.toml
          ./tests/crash_recovery_kill9.sh 3
      - name: Verify built Python SDK wheel
        run: ./scripts/package_release_artifacts.sh --target python-sdk
      - name: Verify VexDB adapter and pip extra
        run: ./scripts/package_release_artifacts.sh --target python-vexdb
