name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip build pytest "maturin>=1.8,<2.0"
          python -m pip install -e "./fuju-trace-db-python[server]"
      - name: Install JavaScript test dependencies
        run: |
          npm ci --prefix fuju-trace-sdk/typescript
          npm ci --prefix fuju-trace-console
          npm ci --prefix fuju-trace-node --omit=optional
      - name: Run full test suite and crash recovery
        run: ./scripts/test_all.sh --crash --crash-rounds 3
      - name: Verify built Python SDK wheel
        run: ./scripts/package_release_artifacts.sh --target python-sdk
