[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fuju-trace-postgresql"
version = "0.1.11"
description = "PostgreSQL storage adapter for Fuju Trace"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fuju Trace" }]
dependencies = ["fuju-trace-sql==0.1.11", "psycopg2-binary>=2.9.5,<3"]

[project.urls]
Homepage = "https://github.com/vibeinging/fuju-trace"
Repository = "https://github.com/vibeinging/fuju-trace"
Issues = "https://github.com/vibeinging/fuju-trace/issues"

[tool.hatch.build.targets.wheel]
packages = ["fuju_trace_postgresql"]
