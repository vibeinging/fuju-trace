license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py38"] }
fuju-trace-engine = { path = "../fuju-trace-engine/crates/fuju-trace-engine" }
